{% extends "layout.html" %}

{% block head %}
    Sell
{% endblock %}

{% block main %}
<form action="/sell" method="post">
    <div class="mb-3">
        <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="symbol" placeholder="Stock to sell" type="text">
        {% if invalid %}
            <div> <b>{{ symbol }}</b> is not a valid ticker or none to sell.</div>
        {% endif %}
    </div>
    </br>
    <div class="mb-3">
        <input autocomplete="off" class="form-control mx-auto w-auto" name="quantity" placeholder="Number of shares" type="text">
        {% if sharerror %}
            <div>Invalid number of shares.</div>
        {% endif %}
    </div>
    <button class="btn btn-primary" type="submit">Sell</button>
    </br>
</form>
{% endblock %}
